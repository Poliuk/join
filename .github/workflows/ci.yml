name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Package.swift needs Swift 6.2 or later. Xcode 26.6 has Swift 6.3 and the macOS 26.5 SDK; it's named
    # rather than taken as the image's default, which GitHub moves to newer Xcodes.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Universal, like releases, so a release tag can't be the first time the Intel build runs.
      - name: Package app
        run: ARCHS="arm64 x86_64" scripts/build-app.sh
      # Zipped with ditto: the artifact upload would drop the executable bit and the bundle folder.
      - name: Zip
        run: ditto -c -k --keepParent build/Join.app build/Join.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Join.app
          path: build/Join.zip
